        const button = header.querySelector('[data-theme-toggle]');
        const ORDER = ['system', 'light', 'dark'];
        const read = () => {
            try {
                const saved = localStorage.getItem('theme');
                return saved === 'light' || saved === 'dark' ? saved : 'system';
            } catch (e) {
                return 'system';
            }

        function apply(mode) {
            if (mode === 'system') {
                delete document.documentElement.dataset.theme;

                document.documentElement.dataset.theme = mode;
                try { localStorage.setItem('theme', mode); } catch (e) {}
            }
            button.dataset.mode = mode;
            const label = button.dataset['label' + mode[0].toUpperCase() + mode.slice(1)];
            button.setAttribute('aria-label', label);
            button.setAttribute('title', label);
        }
        apply(read());
        button.addEventListener('click', () => apply(ORDER[(ORDER.indexOf(read()) + 1) % ORDER.length]));

        // Elements marked [data-reveal] rise in once as they enter the viewport.
        (() => {
            const items = document.querySelectorAll('[data-reveal]');
            if (!('IntersectionObserver' in window) || matchMedia('(prefers-reduced-motion: reduce)').matches) {
                items.forEach((el) => el.classList.add('is-in'));
                return;
            }
            const io = new IntersectionObserver((entries) => {
                for (const entry of entries) {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('is-in');
                        io.unobserve(entry.target);
                    }
                }
            }, { rootMargin: '0px 0px -8% 0px' });
            items.forEach((el) => io.observe(el));
        })();
